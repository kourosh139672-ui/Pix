name: Tom & Jerry Godot Android APK

on:
  push:
    branches: [main]
    paths:
      - "TomJerryGodot/**"
      - ".github/workflows/tom-jerry-godot-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tom-jerry-android
  cancel-in-progress: true

jobs:
  export-android:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Android signing and SDK
        run: |
          set -eux
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -n "$SDK"
          SDK="$(realpath "$SDK")"
          JAVA_DIR="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
          echo "JAVA_HOME=$JAVA_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          if [ -x "$SDK/cmdline-tools/latest/bin/sdkmanager" ]; then
            SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"
          else
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort | tail -n 1)"
          fi
          test -n "$SDKMANAGER"
          chmod +x "$SDKMANAGER"
          yes | "$SDKMANAGER" --sdk_root="$SDK" --licenses >/dev/null 2>&1 || true

          # Godot 4.4.1's Android exporter reliably selects Build Tools 33.0.2.
          # Match the export preset's target SDK to this installed toolchain.
          "$SDKMANAGER" --sdk_root="$SDK" "cmdline-tools;latest" "platform-tools" "platforms;android-33" "build-tools;33.0.2"

          test -d "$SDK/platforms/android-33"
          test -x "$SDK/build-tools/33.0.2/aapt"
          test -x "$SDK/build-tools/33.0.2/aapt2"
          ls -la "$SDK/build-tools/33.0.2"
          ls -la "$SDK/platforms/android-33"

          mkdir -p /root/.android /root/.config/godot
          if [ ! -f /root/.android/debug.keystore ]; then
            keytool -genkeypair -v -keystore /root/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
          cat > /root/.config/godot/editor_settings-4.tres <<EOF
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/java_sdk_path = "$JAVA_DIR"
          export/android/android_sdk_path = "$SDK"
          EOF
          cat /root/.config/godot/editor_settings-4.tres

      - name: Prepare and verify Godot Android export templates
        run: |
          set -eux
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.4.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/
          fi
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/4.4.1.stable"
          test -s "$TEMPLATE_DIR/android_debug.apk"
          test -s "$TEMPLATE_DIR/android_release.apk"
          ls -lh "$TEMPLATE_DIR/android_debug.apk" "$TEMPLATE_DIR/android_release.apk"

      - name: Import Godot project
        run: |
          godot --headless --verbose --editor --path TomJerryGodot --quit

      - name: Export Android APK
        run: |
          set -eux
          mkdir -p build/android
          godot --headless --verbose --path TomJerryGodot --export-debug "Android" "$GITHUB_WORKSPACE/build/android/TomJerry3D.apk"
          test -s build/android/TomJerry3D.apk
          file build/android/TomJerry3D.apk
          ls -lh build/android/TomJerry3D.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: TomJerry3D-Android-APK
          path: build/android/TomJerry3D.apk
          if-no-files-found: error
          retention-days: 30
