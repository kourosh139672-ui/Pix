name: Tom & Jerry Kotlin Android APK

on:
  push:
    branches: [main]
    paths:
      - "TomJerryKotlin/**"
      - ".github/workflows/tom-jerry-kotlin-android.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tom-jerry-kotlin-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Build installable APK
        run: gradle --no-daemon --stacktrace :android:assembleDebug
        working-directory: TomJerryKotlin
      - name: Verify APK
        run: |
          test -s TomJerryKotlin/android/build/outputs/apk/debug/android-debug.apk
          file TomJerryKotlin/android/build/outputs/apk/debug/android-debug.apk
          ls -lh TomJerryKotlin/android/build/outputs/apk/debug/android-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TomJerry3D-Kotlin-Android-APK
          path: TomJerryKotlin/android/build/outputs/apk/debug/android-debug.apk
          if-no-files-found: error
          retention-days: 30
