name: Tom & Jerry Godot Web Build

on:
  push:
    branches: [main]
    paths:
      - "TomJerryGodot/**"
      - ".github/workflows/tom-jerry-godot-web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: tom-jerry-web
  cancel-in-progress: true

jobs:
  export-web:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.4.1
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare Godot export templates
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          if [ -d /root/.local/share/godot/export_templates/4.4.1.stable ]; then
            cp -a /root/.local/share/godot/export_templates/4.4.1.stable ~/.local/share/godot/export_templates/
          fi

      - name: Import project resources
        run: |
          cd TomJerryGodot
          godot --headless --editor --path . --quit

      - name: Export browser game
        run: |
          mkdir -p build/web
          godot --headless --path TomJerryGodot --export-debug "Web" "$GITHUB_WORKSPACE/build/web/index.html"

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: tom-jerry-godot-web
          path: build/web/
          if-no-files-found: error

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-24.04
    needs: export-web
    steps:
      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v4
